version: '3.8'

services:
  backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: podai-backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - MAX_UPLOAD_SIZE=50000000
      - USE_LOCAL_MODEL=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Uncomment below if you want to use OpenAI instead of OpenRouter
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      - APP_URL=${APP_URL}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - UPLOAD_FOLDER=/tmp/uploads
      - UPLOAD_PATH=/api/pdf/upload
      - CHROMA_PROTOCOL=http
      - LOG_DIRECTORY=/app/logs
      - LOG_FILE=/app/logs/app.log
      - LLM_MODEL=gpt-3.5-turbo
      - LLM_TEMPERATURE=0.7
      - LLM_MAX_LENGTH=4096
    volumes:
      - ./uploads:/tmp/uploads
      - ./logs:/app/logs
      - backend_data:/app/data
    ports:
      - "8081:3000"
      - "3000:3000"
    networks:
      podai-network:
        aliases:
          - podai-backend
    depends_on:
      chromadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: podai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - podai-network

  chromadb:
    build:
      context: .
      dockerfile: chromadb.Dockerfile
    container_name: podai-chromadb
    restart: unless-stopped
    environment:
      - CHROMA_CONFIG_FILE=/config.yaml
      - CHROMA_SERVER_HTTP_CORS_ALLOW_ORIGINS=http://localhost:8080,http://localhost:3000,http://frontend:80,http://podai-frontend:80,http://backend:3000,http://podai-backend:3000
      - CHROMA_SERVER_HTTP_CORS_ALLOW_CREDENTIALS=true
    volumes:
      - chromadb_data:/chroma/data
      - ./config.yaml:/config.yaml
      - ./logging_config.yaml:/logging_config.yaml
    ports:
      - "8000:8000"
    networks:
      podai-network:
        aliases:
          - chromadb
    healthcheck:
      # Use a different health check that doesn't depend on the API being up yet
      test: ["CMD", "ls", "/chroma"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Optional database
  # db:
  #   image: postgres:15-alpine
  #   container_name: podai-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=podai
  #     - POSTGRES_PASSWORD=podai_password
  #     - POSTGRES_DB=podai
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - podai-network

networks:
  podai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    # Add specific DNS configuration for the network
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  backend_data:
  chromadb_data:  # Added persistent volume for ChromaDB
  # db_data: