version: '3.8'

services:
  backend:
    build:
      context: ./node-backend
      dockerfile: Dockerfile
    container_name: podai-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - MAX_UPLOAD_SIZE=10485760
      - OLLAMA_BASE_URL=http://ollama:11434
      - USE_LOCAL_MODEL=true
      - OLLAMA_MODEL=granite3.2
      # Add other environment variables as needed
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    ports:
      - "8081:3000"
    networks:
      - podai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: podai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - podai-network

  ollama:
    image: ollama/ollama:latest
    container_name: podai-ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - podai-network

  # Optional database
  # db:
  #   image: postgres:15-alpine
  #   container_name: podai-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=podai
  #     - POSTGRES_PASSWORD=podai_password
  #     - POSTGRES_DB=podai
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - podai-network

networks:
  podai-network:
    driver: bridge

volumes:
  backend_uploads:
  backend_data:
  # db_data:
  ollama:
    driver: local