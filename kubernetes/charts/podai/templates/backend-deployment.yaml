apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  labels:
    app: {{ .Values.backend.name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.name }}
        release: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        {{- if .Values.backend.secretEnv }}
        checksum/secrets: {{ include (print $.Template.BasePath "/backend-secrets.yaml") . | sha256sum }}
        {{- end }}
    spec:
      containers:
        - name: {{ .Values.backend.name }}
          image: "{{ .Values.global.imageRegistry }}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Values.backend.name }}-config
          {{- if .Values.backend.secretEnv }}
            - secretRef:
                name: {{ .Values.backend.name }}-secrets
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.backend.persistence.enabled }}
            - name: uploads
              mountPath: /app/uploads
            - name: data
              mountPath: /app/data
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 15
      volumes:
        {{- if .Values.backend.persistence.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.backend.name }}-uploads-pvc
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.backend.name }}-data-pvc
        {{- end }}
