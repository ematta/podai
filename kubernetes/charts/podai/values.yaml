# Default values for podai chart
# This is a YAML-formatted file.

global:
  environment: production
  imageRegistry: ""  # Use Docker Hub by default

backend:
  name: podai-backend
  image:
    repository: podai-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  env:
    NODE_ENV: production
    PORT: 3000
    LOG_LEVEL: info
    MAX_UPLOAD_SIZE: 10485760
  # Secret environment variables - override these with actual values
  secretEnv:
    # OPENAI_API_KEY: ""
    # HUGGINGFACE_API_KEY: ""
  persistence:
    enabled: true
    uploads:
      size: 10Gi
      storageClass: ""
    data:
      size: 5Gi
      storageClass: ""

frontend:
  name: podai-frontend
  image:
    repository: podai-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # kubernetes.io/tls-acme: "true"
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: podai.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls: []
  # - secretName: podai-tls
  #   hosts:
  #     - podai.example.com

# Database settings - optional
database:
  enabled: false
  type: postgres
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  service:
    port: 5432
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  env:
    POSTGRES_USER: podai
    POSTGRES_DB: podai
  secretEnv:
    # POSTGRES_PASSWORD: ""
